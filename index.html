<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safety Flash Database</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14202b;--mut:#5d6b78;--bd:#dfe4ea;--ac:#e8590c;--acx:#fff;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b222a;--tx:#eef1f4;--mut:#9aa7b4;--bd:#2c3641;--ac:#ff8a3d;--acx:#1a1000;--ok:#69db7c}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b222a;--tx:#eef1f4;--mut:#9aa7b4;--bd:#2c3641;--ac:#ff8a3d;--acx:#1a1000;--ok:#69db7c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{background:var(--ac);color:var(--acx);padding:18px 84px 18px 16px;position:relative}
header .logo{position:absolute;top:50%;right:16px;transform:translateY(-50%);height:58px;width:auto}
header h1{margin:0;font-size:1.35rem}
header p{margin:4px 0 0;font-size:.9rem;opacity:.9}
header p.by{margin-top:2px;font-size:.7rem;font-weight:400;opacity:.6}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
input[type=search],input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
.chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
a.folder{display:block;text-align:center;padding:13px;border-radius:10px;background:var(--card);border:2px solid var(--ac);color:var(--ac);font-weight:700;text-decoration:none;margin-bottom:12px}
.count{color:var(--mut);font-size:.85rem;margin:6px 2px 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.meta{font-size:.78rem;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.card h2{font-size:1.02rem;margin:6px 0 10px}
.btns{display:flex;gap:8px}
a.btn{flex:1;text-align:center;padding:10px;border-radius:9px;text-decoration:none;font-weight:600;font-size:.92rem;border:1px solid var(--ac);color:var(--ac)}
a.btn.p{background:var(--ac);color:var(--acx)}
.warn{background:#fff3bf;color:#5c4400;border-radius:8px;padding:8px 10px;font-size:.8rem;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.foot{margin-top:18px;text-align:center}
.foot button{background:none;border:none;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:.85rem}
#qrbox{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px;text-align:center}
#qrbox svg{width:240px;height:240px;max-width:100%;background:#fff;padding:6px;border-radius:8px;margin:10px 0}
#qrbox button{padding:10px 16px;border-radius:9px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);font-weight:600;cursor:pointer}
.tag{font-weight:700;padding:1px 8px;border-radius:999px;color:#fff}.tag.fl{background:#2b8a3e}.tag.al{background:#d9480f}
.sev{font-weight:600;color:var(--tx)}
details{margin:2px 0 12px;font-size:.9rem}summary{cursor:pointer;color:var(--ac);font-weight:600}details p{margin:8px 0 0}.fn{color:var(--mut);font-size:.78rem;word-break:break-all}
@media print{body *{visibility:hidden}#qrbox,#qrbox *{visibility:visible}#qrbox{position:absolute;left:0;top:0;width:100%;border:none}#qrbox input,#qrbox button{display:none}}
</style>
</head>

  {type:"PFI Alert", no:"CSHE-Juli-2025", date:"2025-07-14", area:"Neverson Quarry, Carolina Utara, USA", sev:"PFI (Potential Fatality Injury)",

   sum:"Saat membongkar pompa di lubang tambang yang direlokasi, karyawan maintenance tersengat listrik 480 V karena menyentuh kabel bertegangan di pemutus arus lapangan. Kontraktor teknisi listrik hanya memutus kabel ke motor pompa, bukan catu daya dari MCC. Asisten Plant Manager tidak memverifikasi pekerjaan itu dan tidak ada kunci/tag (LOTOTO) yang dipasang. Karyawan juga tidak memenuhi syarat untuk pekerjaan kelistrikan.",
   act:"Refreshment training Protokol Manajemen Kontraktor (verifikasi pekerjaan di lapangan) dan Protokol Isolasi Energi (pastikan peralatan terkunci meski diyakini sudah mati), pelatihan ulang Take 5, sanksi disiplin bagi karyawan, dan Asisten Plant Manager dibebastugaskan dari peran kepemimpinan."},
  {type:"Safety Alert", no:"02-CSHE-Januari-2025", date:"2025-01-17", area:"Bridgeport Quarry, Texas, USA", sev:"MTI · Karyawan",
   title:"Terkena arc flash saat mengukur tegangan 4160 V", file:"Group Safety Alert 02-MTI-Bridgeport Quarry-USA-Aggregate.pdf", drive:"1yAPGJg7BjIaj_zZFvTuWykCSsJY2J_RH",
   sum:"Setelah maintenance, teknisi listrik memeriksa pompa GIW 18x18 yang tidak mau menyala. Saat mengukur tegangan 4160 V, multimeter masih berada di selektor 600 V ketika hendak dipindah ke 5000 V, sehingga terjadi arc flash. APD arc flash suit sudah disiapkan tetapi tidak dipakai. Penyebab: Take 5 tidak dilakukan, tidak ada Work Hazard Assessment dan alur troubleshooting listrik, serta pelatihan tidak disertai praktik.",
   act:"Pelatihan ulang semua teknisi listrik (multimeter dan APD arc flash), pemeriksaan acak Take 5 kelistrikan 2x seminggu selama 6 minggu, program pelatihan WHA dan alur troubleshooting, pelatihan arc flash untuk teknisi dan manajemen, serta evaluasi kontrol tambahan oleh steering team."},
  {type:"Near Hit Alert", date:"2025-07-02", area:"Cirebon, Indonesia (PT SUN, proyek Solar CCC)", sev:"Near hit · tanpa cedera",
   title:"Atap korosif runtuh, pekerja tertahan full body harness", file:"BAHASA_Near_hit_Alert - Cirebon PT.SUN Fall from Heights.pdf", drive:"1P1nMf92mi7wVX56kyA3Q8Lf6lu9e_igG",
   sum:"Pada 2 Jul 2025 pukul 09:25 WIB, pekerja yang memasang lifeline di atap pabrik karung kertas Cirebon menyimpang dari papan kerja dan berjalan langsung di atap korosif untuk mengambil tali manila sekitar 1 m darinya. Atap runtuh dan pekerja jatuh, tetapi tertahan full body harness sampai ditarik naik oleh dua rekannya. Tidak ada cedera. Penyebab: melanggar metode kerja, penilaian risiko kurang, tidak ada pre-start check kondisi atap, dan tidak ada pengawasan.",
   act:"Pengarahan khusus dan penegasan hanya berjalan di walkway; pemeriksaan awal kondisi atap oleh tim teknis; informasi dibagikan ke pegawai dan kontraktor; pekerja tidak boleh bekerja sendirian dan wajib disupervisi; verifikasi walkway sementara di semua proyek Solar PV dan prioritaskan fasilitas permanen (walkway, lifeline, handrail)."},
  {type:"Safety Alert", no:"01-CSHE-Nov-2025", date:"2025-07-22", area:"Górażdże (MC1-3 level 3), Polandia", sev:"PFI/LTI · Karyawan",
   title:"Lengan terputus terjepit head pulley belt conveyor", file:"Group Safety Alert-LTI PFI-Terjepit Head Pulley BC-Polandia-22Jul25-Bahasa.pdf", drive:"1F0C0QKQ7ae1tojU9Dou0f39jnXI-cywF",
   sum:"Pada shift malam 22 Jul 2025, belt conveyor clinker U1U04 tidak bisa dinyalakan dari CCR dan dua operator menyalakannya lewat local switch. Saat conveyor mencicit di head pulley, seorang operator melepas pelindung (guard) head pulley yang sedang berputar untuk menyiramnya dengan air memakai botol buatan sendiri. Tangan kanannya tersangkut di nip point dan lengan kanannya terlepas dari sendi bahu. Korban tetap sadar dan dibawa ke rumah sakit. Temuan investigasi: baut pengunci guard tidak ditemukan sehingga guard bisa dilepas tanpa alat; menyiram head pulley adalah praktik tidak resmi yang diduga sudah bertahun-tahun; tidak ada laporan di AID; korban tidak diperintahkan melakukannya dan tahu larangan melepas guard serta kewajiban LOTOTO. Penyebab tidak langsung: budaya pelaporan lemah dan desain guard yang mudah dilepas.",
   act:"Safety Alert dan pelatihan bahaya belt conveyor termasuk LOTOTO, diskusi Zero Tolerance dan kewajiban lapor lewat AID, identifikasi teknik kerja tidak resmi lalu susun prosedur resminya, inspeksi sistem guarding, tambah rambu K3 di titik kritis, tinjau Instruksi K3 Bekerja Aman pada Conveyor Bahan Curah (kasus slipping di head pulley) dan lembar penilaian risiko."},
  {type:"Safety Flash", date:"2025-07-22", area:"Górażdże (MC1-3 level 3), Polandia", sev:"PFI/LTI · Karyawan",
   title:"Laporan awal: karyawan tertarik head pulley, lengan terputus", file:"Group Safety Flash-LTI PFI-Belt Conveyor-Poland 24072025.pdf", drive:"1mPa_iDJLbVHx1IqRL_03juFgnwpckklc",
   sum:"Laporan awal untuk insiden yang sama dengan Safety Alert di atas (22 Jul 2025, 22:57). Karyawan produksi tertarik ke head pulley belt conveyor clinker yang berputar sehingga seluruh lengan dan sendi bahunya terputus. Korban hidup dan stabil tetapi cedera sangat parah dan kemungkinan menyebabkan cacat permanen. CCR mendeteksi kendala conveyor dan meminta tim shift memeriksa; operator diduga menghidupkan conveyor secara manual untuk alasan yang belum diketahui. Foto investigasi menunjukkan jeriken plastik di bawah head pulley dan tidak adanya baut pengunci pada pelindung terakhir. Investigasi dilakukan pihak internal dan pihak berwenang.", act:""},
  {type:"Safety Flash", date:"2025-10-22", area:"Arrigorriaga Cement Plant, Spanyol", sev:"Fatality · Karyawan",
   title:"Terbentur benda kerja yang berputar di mesin bubut", file:"Group Safety Flash-Fatality-CEM-Spain-Lathing machine.pdf", drive:"1IjASozH0V4cky9n80zAVywRj3ViBvJrg",
   sum:"Sekitar pukul 14:20, Foreman Maintenance mengamplas poros benda kerja yang berputar di mesin bubut secara manual. Sebagian benda kerja diduga tersangkut di sarung tangan kiri atau kaos polo, menarik pekerja ke arah benda kerja hingga kepalanya terbentur. Rekan kerja di sisi lain mesin membelakangi korban dan tidak melihat bagaimana benda kerja tersangkut. Prosedur darurat langsung diaktifkan tetapi korban tidak tertolong. Penyebab pasti belum diketahui dan investigasi internal sedang berjalan.", act:""},
  {type:"Safety Alert", no:"06-CSHE-July-2025", date:"2025-05-26", area:"Plant 14 Citeureup (Proyek Debaler)", sev:"LTI · Kontraktor (PT NSJ)",
   title:"Jari terjepit rantai transmisi saat commissioning conveyor", file:"Safety Alert-LTI-Contractor-Deballer P14-CCC Project-Rev.pdf", drive:"1e1MRg2tnInC6-NFNsaxWxgOJZyB3Ydx2",
   sum:"Saat commissioning dan uji beban Conveyor CV.01 proyek Debaler, platform tempat motor terpasang bergerak maju sehingga motor dimatikan. Supervisor PT Harden kemudian meminta korban (kontraktor PT NSJ) naik ke platform dan mengangkat bagian atas rantai transmisi yang posisinya stuck, tanpa alat bantu. Platform tiba-tiba bergerak mundur dan jari-jari kedua tangan korban terjepit di antara rantai dan roda gigi. Korban dibawa ke RS Paragon Citeureup. Penyebab: rantai diangkat tanpa alat bantu, tanggung jawab tidak jelas, tidak ada penilaian risiko untuk bagian mekanis, tidak ada pengawas yang menghentikan pekerjaan, checklist pra-commissioning tidak terbukti selesai, dan struktur motor belum sempurna.",
   act:"Klarifikasi kesesuaian desain struktur termasuk tangga akses, Supervisor PT Harden diberhentikan dari proyek, checklist pra-commissioning wajib dilakukan dan didokumentasikan, commissioning wajib punya WSP berisi JSA dan DRA untuk risiko baru, pengawasan keselamatan sehari-hari, serta pengarahan JSA untuk OEM engineer dan pengawas eksternal."},
  {type:"Safety Flash", no:"001-Flash-2025", date:"2025-02-09", area:"Gudang Serasa, Brunei", sev:"LTI",
   title:"Jatuh 4,9 m menembus atap polikarbonat saat perawatan panel surya", file:"Group Safety_Flash - LTI - BRUNEI - Fall from Roof.pdf", drive:"1oCpF9c6Rg3kc-mp63e056sRi9Khf-u67",
   sum:"Saat perawatan preventif panel surya di atap gudang, tim listrik (4 orang) berada di dua atap yang terhubung talang air. Korban berada di atap Gudang 2 tanpa lifeline. Ketika diajak beristirahat ia tetap melanjutkan ke sisi lain panel surya dan menginjak lembaran polikarbonat transparan yang pecah, lalu jatuh dari ketinggian 4,9 m. Korban sadar dengan pendarahan di kepala/dahi kanan, mendapat pertolongan pertama, dan dibawa ambulans ke rumah sakit. Catatan: korban memakai full body harness dan APD lengkap, tetapi harness tidak dikaitkan ke titik angkur.", act:""},
  {type:"Safety Flash", date:"2025-10-20", area:"RMC Plant Yenibosna, Turki", sev:"Fatality · Kontraktor (pengemudi bulk semen)",
   title:"Pengemudi truk semen tertabrak dan terlindas wheel loader yang mundur", file:"Safety Flash-Fatality-Wheel Loader-RMC-Turkey-20Oct25.pdf", drive:"1ahz15cMmaX3x8DN9PLF1MJOUj1rSStU9",
   sum:"Sekitar pukul 16:10, operator loader tiba di area pelumasan peralatan; di dekatnya dua truk semen curah sedang unloading. Rekaman menunjukkan kedua pengemudi truk berdiri tepat di belakang loader, fokus pada ponsel dan berbincang. Operator loader mundur tanpa menyadari mereka dan menabrak keduanya: satu berhasil menyelamatkan diri, satu lagi jatuh di bawah loader dan terlindas roda. Korban (61 tahun, karyawan perusahaan transportasi semen yang dikontrak) meninggal. Loader sudah memakai spion, kamera dan monitor, serta alarm mundur yang diperiksa berfungsi, tetapi operator hanya menoleh ke kiri dan kanan tanpa melihat monitor kamera, dan kedua pengemudi tampak tidak bereaksi pada loader yang mendekat. Operator akan diadili dan laporan resmi penegak hukum masih ditunggu; investigasi internal berjalan.", act:""},
  {type:"Safety Flash", date:"2025-10-14", area:"Ghioroc, Rumania (Agregat)", sev:"Fatality · Kontraktor/Subkontraktor",
   title:"Tertimpa lift arm wheel loader saat perbaikan sistem hidrolik (versi Bahasa)", file:"Safety Flash - 2025-10-14 - RO-AGG-Ghioroc-Bahasa.pdf", drive:"1ffmZDVOFziKb_IKLpe3RzraAkzZ0Jdb1",
   sum:"Pada 14 Okt 2025 pukul 17:20, tim servis dua orang dari Disar Energy SRL (termasuk pemilik perusahaan) memperbaiki sistem pengangkat hidrolik front-end loader Volvo. Setelah induksi K3, bucket ditahan dalam posisi menggantung dengan penyangga logam milik kontraktor lalu silinder hidrolik mulai dibongkar. Seorang kontraktor (21 tahun) berdiri dengan tubuh bagian atas di antara lift arm dan chassis ketika pengaman bucket gagal; lift arm turun karena gravitasi dan menimpa dadanya. Korban meninggal di lokasi. Kedua pekerja ternyata bersaudara: korban adalah adik pemilik perusahaan kontraktor yang juga koordinator tim. Penyebab pasti masih diselidiki.",
   act:"Langkah segera: investigasi internal (polisi menyelidiki secara paralel), konseling psikologis, dan Safety Stand-Down 6-8 jam (satu shift) di seluruh negara, di mana semua aktivitas operasional berhenti, manajemen senior menyampaikan Safety Flash lewat videoconference, dan tiap site meninjau tugas harian untuk mengidentifikasi titik risiko tinggi, gap analysis, dan rencana aksi. Lalu kampanye komunikasi, banner pengingat, serta percepatan H&S Action Plan."},
  {type:"Safety Flash", date:"2025-10-14", area:"Ghioroc, Rumania (Agregat)", sev:"Fatality · Kontraktor/Subkontraktor",
   title:"Tertimpa lift arm wheel loader saat perbaikan sistem hidrolik (versi Inggris)", file:"Safety Flash - 2025-10-14 - RO-AGG-Ghioroc.pdf", drive:"1OhbKGmoIZ8TfMXKcYOkCAZ8NZSOcpVhH",
   sum:"Pada 14 Okt 2025 pukul 17:20, tim servis dua orang dari Disar Energy SRL (termasuk pemilik perusahaan) memperbaiki sistem pengangkat hidrolik front-end loader Volvo. Setelah induksi K3, bucket ditahan dalam posisi menggantung dengan penyangga logam milik kontraktor lalu silinder hidrolik mulai dibongkar. Seorang kontraktor (21 tahun) berdiri dengan tubuh bagian atas di antara lift arm dan chassis ketika pengaman bucket gagal; lift arm turun karena gravitasi dan menimpa dadanya. Korban meninggal di lokasi. Kedua pekerja ternyata bersaudara: korban adalah adik pemilik perusahaan kontraktor yang juga koordinator tim. Penyebab pasti masih diselidiki.",
   act:"Langkah segera: investigasi internal (polisi menyelidiki secara paralel), konseling psikologis, dan Safety Stand-Down 6-8 jam (satu shift) di seluruh negara, di mana semua aktivitas operasional berhenti, manajemen senior menyampaikan Safety Flash lewat videoconference, dan tiap site meninjau tugas harian untuk mengidentifikasi titik risiko tinggi, gap analysis, dan rencana aksi. Lalu kampanye komunikasi, banner pengingat, serta percepatan H&S Action Plan."},
  {type:"Safety Alert", date:"2025-12-02", area:"Zagreb, Kroasia (RMC)", sev:"Fatality · Pihak ketiga",
   title:"Truk beton subkontrak menabrak mobil dari belakang di lampu lalu lintas", file:"Safety Flash-Fatality-Traffic-RMC Kroasia.pdf", drive:"1K6d61yuSjWWE6nZ9XhhBEUWw1BWNLT1I",
   sum:"Pada 2 Des 2025 pukul 12:30 di Zagreb, pengemudi subkontrak Beton Darojkovic yang mengantar beton ke lokasi konstruksi menabrak dari belakang sebuah mobil penumpang yang berhenti di lampu lalu lintas. Mobil dikemudikan wanita 62 tahun; penumpangnya (88 tahun) terluka dan kemudian meninggal di RS KBC Zagreb, sedangkan pengemudi mobil luka ringan. Penyebab langsung: pengemudi tidak menyesuaikan cara mengemudi dan jarak aman dengan permukaan jalan yang licin.",
   act:"Sarankan pihak ketiga memesan kendaraan baru dengan AEBS (Automatic Emergency Braking System) dan kamera kabin, adakan pelatihan mengemudi aman serta pelaporan insiden dan near hit lewat kode QR untuk pengemudi subkontrak, dan semua subkontraktor serta pengangkut menandatangani lembar konfirmasi telah memahami Safety Alert ini."},
  {type:"Safety Flash", no:"01-CSHED-September-2026", date:"2026-09-11", area:"Monroe County Quarry, Bolingbroke, Georgia, USA", sev:"Fatality · Pengemudi transporter (subkontraktor)",
   title:"Truk subkontraktor tertabrak kereta api di perlintasan", file:"11 - (11 September 2026) Group Safety Flash-Fatality-DT Agg-Traffic-Quarry Bolingbroke Georgia-USA.pdf", drive:"1GepVkRsK-pR-kgWLd34jD_VmUpEtPPOf",
   sum:"Setelah keluar dari area Monroe County Quarry, sebuah truk yang dioperasikan pengemudi dari perusahaan pengangkut subkontraktor hendak melintasi jalur kereta api dan tertabrak kereta. Pengemudi cedera parah dan meninggal beberapa hari kemudian. Sebelum perlintasan ia sudah melewati rambu keselamatan perkeretaapian saat meninggalkan lokasi, dan di perlintasan terdapat rambu STOP dengan lampu merah berkedip.", act:""},
  {type:"Safety Alert", no:"AID THA-1001245", date:"2026-08-10", area:"Jalan Rute 3196 menuju Pabrik Takli, Thailand (CEM Logistics)", sev:"First Aid · PFI · Pengemudi kontraktor",
   title:"Truk klinker keluar dari jalan setelah lampu depan padam", file:"Group Safety Alert-LTI PFI-Driving OFF site-Thailand-10AUG2026.pdf", drive:"1geHTdoT88wc5PH_gaYklpjsNWl7RlvS_",
   sum:"Pada 10 Agu 2026 sekitar pukul 00:51, truk pengangkut klinker bermuatan penuh berangkat dari Pabrik Pukrang menuju Pabrik Takli. Sekitar satu jam kemudian di jalan umum Rute 3196, lampu depan tiba-tiba padam di lokasi yang tidak punya penerangan jalan. Dengan kecepatan sekitar 80 km/jam truk oleng ke kiri, menabrak pagar pengaman dan keluar dari badan jalan; trailer terguling dan sekitar 90% muatan klinker tumpah. Pengemudi hanya memar di kedua lutut dan boleh pulang setelah pemeriksaan; tidak ada pihak lain terlibat. Penyebab dasar: mengemudi terlalu cepat (batas truk bermuatan di bawah 60 km/jam), lampu depan rusak, kemungkinan pengemudi terdistraksi (kamera kabin ditutup), dan tidak ada lampu jalan di lokasi.",
   act:"Komunikasikan ke semua pengemudi agar mengurangi kecepatan dan waspada saat malam, tekankan inspeksi truk khususnya sistem penerangan, pantau perilaku mengemudi dan posisi kamera kabin, serta beri tindakan disiplin atas pelanggaran batas kecepatan dan penutupan kamera."},
  {type:"Safety Flash", date:"2026-08-08", area:"Tarjun Plant (P12), Raw Mill (Bucket Elevator 361 BE1)", sev:"Fatality · Karyawan (FTE)",
   title:"Fluid coupling pecah dan terlempar saat troubleshooting bucket elevator Raw Mill", file:"IDN Safety Flash-Fatality-FTE-Coupling Bucket-Raw Mill-P12 Tarjun 8Aug26-R1 BAHASA.pdf", drive:"1TEdXlhTc-TXIUA1tsNaHuaDNNanKDxME",
   sum:"Pada 8 Agu 2026 pukul 11:03 WITA, Supervisor Maintenance bersama dua Shift Mechanic dan dua pekerja kontraktor melakukan troubleshooting di top bucket elevator Raw Mill (Level 5, lantai 8) untuk melepaskan inching coupling yang macet. Setelah coupling terlepas, bucket elevator tiba-tiba bergerak turun sehingga fluid coupling pada main drive berputar dan pecah. Fragmennya terlempar dan diduga mengenai Supervisor Maintenance. Keempat pekerja lain selamat dan diperiksa di poliklinik. Tim Fire Rescue dimobilisasi dalam hitungan menit; korban ditemukan tengkurap di platform atas dengan jarak pandang terbatas akibat debu, mengalami cedera fatal dan tidak menunjukkan tanda kehidupan.", act:""},
  {type:"Safety Flash", date:"2026-04-22", area:"Kattameya Cement Works, Mesir", sev:"Fatality · Karyawan (FTE)",
   title:"Supervisor mekanik tewas, komponen gearbox hoist terlempar (versi Bahasa)", file:"Group Safety Flash-Fatality-FTE-Kattameya Cement Works 22042026-BAHASA.pdf", drive:"1or069jpb3i-LVPNAzcjPY_O5WC26ESox",
   sum:"Pada 22 Apr 2026 pukul 13:00, Supervisor Maintenance Mekanik bersama dua pekerja lain mengganti motor hoist rusak di atap AF Storage. Sistem hoist masih menahan beban sehingga ada energi mekanik tersimpan. Untuk mencegah poros berputar dipakai penahan improvisasi: dua batang logam dilas pada poros hoist, yang bukan isolasi energi atau lockout standar. Penahan itu gagal, poros berputar cepat saat beban masih tegang, dan gearbox rusak katastropik. Komponen terlempar menembus tubuh supervisor (fatal) dan mengenai seorang kontraktor yang tetap sadar dan boleh pulang setelah dirawat. Izin kerja aman, isolasi listrik, dan penilaian risiko dilaporkan sudah ada. Investigasi masih berjalan.",
   act:"ASIA: setiap fasilitas harus punya metode jelas untuk mengisolasi semua energi tersimpan (pegas terkompresi, komponen terangkat atau tergantung, tekanan hidrolik/pneumatik residual, kapasitor, energi termal, flywheel, komponen yang bisa jatuh); sediakan perangkat isolasi energi yang disetujui di semua fasilitas; tinjau SOP dan izin kerja agar energi tersimpan dilepas dan diverifikasi sebelum bekerja; sampaikan insiden dengan catatan tanda tangan. Rekomendasi EXCOM/Indocement Safety Committee: risk assessment untuk semua pekerjaan mekanikal, terutama perawatan peralatan angkat (hoist, crane, chain block, dll.), dan LOTOTO yang efektif untuk semua jenis energi, bukan hanya listrik."},
  {type:"Safety Flash", date:"2026-04-22", area:"Kattameya Cement Works, Mesir", sev:"Fatality · Karyawan (FTE)",
   title:"Supervisor mekanik tewas, komponen gearbox hoist terlempar (versi Inggris)", file:"Group Safety Flash Kattameya Cement Works 22.04.2026.pdf", drive:"1l9LVPobQJzrlYcN00A525AjhsyQZSj6e",
   sum:"Pada 22 Apr 2026 pukul 13:00, Supervisor Maintenance Mekanik bersama dua pekerja lain mengganti motor hoist rusak di atap AF Storage. Sistem hoist masih menahan beban sehingga ada energi mekanik tersimpan. Untuk mencegah poros berputar dipakai penahan improvisasi: dua batang logam dilas pada poros hoist, yang bukan isolasi energi atau lockout standar. Penahan itu gagal, poros berputar cepat saat beban masih tegang, dan gearbox rusak katastropik. Komponen terlempar menembus tubuh supervisor (fatal) dan mengenai seorang kontraktor yang tetap sadar dan boleh pulang setelah dirawat. Izin kerja aman, isolasi listrik, dan penilaian risiko dilaporkan sudah ada. Investigasi masih berjalan; tindakan pencegahan akan disampaikan setelah investigasi selesai.", act:""},
  {type:"Update Fatality", date:"2026-02-24", area:"Lithonplus, Demmin, Jerman", sev:"Fatality · Karyawan",
   title:"Update investigasi (status 17 Apr 2026): pekerja terjepit piston mesin", file:"2026 03 23 Update Fatality Lithon Demmin Update - Bahasa.pdf", drive:"1ZhfRM8bnvB1q04HsL0bQ9i7qZfKx09RY",
   sum:"Pada 24 Feb 2026 (sore menjelang malam) di Lithonplus, Demmin, seorang karyawan internal berusia 56 tahun terjepit susunan piston yang turun saat mengambil material batu yang tertinggal di mesin, tanpa memakai alat bantu pengambil yang disediakan. Status investigasi per 17 Apr 2026: kegagalan penerapan LOTOTO dan faktor perilaku diduga penyebab paling mungkin; konsep keselamatan dinilai belum memadai; tidak ada indikasi kegagalan mekanis atau perangkat lunak. Pintu pengaman hanya menghentikan area terkait dan LOTOTO pada pintu tidak dapat diterapkan; mesin No. 5 bisa dioperasikan dalam mode manual (Auto, Slow, Fast) yang diduga dipakai sebagai solusi sementara saat banyak batu tidak sesuai spesifikasi. Keterangan saksi di bawah otoritas jaksa belum dapat diakses tim investigasi.",
   act:"Sudah dilakukan: dukungan psikologis, Safety Stand-Down Lithon 25 Feb 2026, investigasi bersama pihak berwenang dan BG dengan ahli eksternal, dan evaluasi bahaya sejenis di seluruh lokasi Lithon. Tindak lanjut: finalisasi dan implementasi konsep keselamatan baru di Demmin dan semua lokasi, pelatihan K3 tambahan bagi pekerja produksi, analisis bahaya serupa di seluruh business line, koordinasi dengan jaksa, dukungan tambahan bagi karyawan, dan tindakan disipliner setelah investigasi selesai."},
  {type:"Safety Flash", date:"2026-04-22", area:"Kattameya Cement Works, Mesir", sev:"Fatality · Karyawan",
   title:"Materi rapat EXCOM: fatality hoist Kattameya", file:"Group Safety Flash-Fatality-hoist-Egypt-EXCOM Meeting-PPT Bahasa.pdf", drive:"1U-fxo6Po-3KsDJ3E2N_wto3GoZurPMIr",
   sum:"Materi presentasi (PPT) untuk rapat Board Heidelberg Materials tentang fatality di Kattameya Cement Works, 22 Apr 2026 pukul 13:00 (terkena benda bergerak/terlempar). Supervisor Maintenance Mekanik tewas saat penggantian motor hoist di atap AF Storage: hoist masih berbeban, poros ditahan dengan dua batang logam yang dilas (penahan improvisasi, bukan isolasi energi), penahan itu gagal dan gearbox pecah, komponen terlempar menembus tubuh korban. Seorang kontraktor terluka tetapi sadar dan boleh pulang. Investigasi masih berjalan.",
   act:"ASIA: metode jelas untuk mengisolasi semua energi tersimpan (bukan hanya listrik), perangkat isolasi energi yang disetujui tersedia di semua fasilitas, tinjau SOP dan izin kerja agar energi tersimpan dilepas dan diverifikasi, dan sampaikan insiden dengan catatan tanda tangan. Rekomendasi EXCOM/I-SC: Risk Assessment dan Dynamic Risk Assessment untuk setiap pekerjaan mekanikal, terutama peralatan angkat (hoist, crane, chain block, dll.), serta LOTOTO efektif untuk semua jenis energi."}
];
/* ============================================================ */

const $ = s => document.querySelector(s);
let year = "Semua";
const years = ["Semua","2026","2025","2024"];

function fileId(v){
  const m = String(v).match(/\/d\/([\w-]+)/) || String(v).match(/[?&]id=([\w-]+)/);
  return m ? m[1] : String(v).trim();
}
function fmt(d){
  if(d.length===4) return "Tahun "+d;
  const [y,m,day] = d.split("-");
  const bln = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return `${+day} ${bln[+m-1]} ${y}`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderChips(){
  $("#chips").innerHTML = years.map(y=>`<button class="chip" data-y="${y}" aria-pressed="${y===year}">${y}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{year=b.dataset.y;renderChips();render()});
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const rows = FLASHES
    .filter(f => year==="Semua" || f.date.startsWith(year))
    .filter(f => !q || (f.no+" "+f.title+" "+f.area+" "+f.type+" "+f.sev+" "+(f.sum||"")).toLowerCase().includes(q))
    .sort((a,b)=>b.date.localeCompare(a.date));
  $("#count").textContent = rows.length + " dokumen";
  $("#list").innerHTML = rows.length ? rows.map(f=>{
    const id = f.drive ? fileId(f.drive) : "";
    return `<div class="card">
      <div class="meta"><span class="tag ${f.type==='Safety Flash'?'fl':'al'}">${esc(f.type)}</span><span>${fmt(f.date)}</span>${f.no?`<span>${esc(f.no)}</span>`:''}</div>
      <div class="meta"><span>📍 ${esc(f.area)}</span><span class="sev">${esc(f.sev)}</span></div>
      <h2>${esc(f.title)}</h2>
      ${f.sum?`<details><summary>Ringkasan kejadian</summary><p>${esc(f.sum)}</p>${f.act?`<p><b>Pencegahan:</b> ${esc(f.act)}</p>`:''}</details>`:''}
      <div class="btns">
        <a class="btn p" target="_blank" rel="noopener" href="${id?'https://drive.google.com/file/d/'+id+'/view':FOLDER}">${id?'Buka PDF':'Buka di Drive'}</a>
        ${id?`<a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/uc?export=download&id=${id}">Unduh</a>`:''}
      </div></div>`;
  }).join("") : '<div class="empty">Tidak ada safety flash yang cocok.</div>';
}

$("#q").oninput = render;
$("#qrToggle").onclick = () => {
  const b = $("#qrbox"); b.style.display = b.style.display==="block" ? "none" : "block";
  if(!$("#qrurl").value){ try{ $("#qrurl").value = location.href.split("#")[0]; }catch(e){} }
  makeQR();
};
$("#qrurl").oninput = makeQR;
$("#qrprint").onclick = () => window.print();
function makeQR(){
  const u = $("#qrurl").value.trim();
  try{
    if(!u || typeof qrcode==="undefined"){ $("#qrout").innerHTML=""; return; }
    const qr = qrcode(0,"M"); qr.addData(u); qr.make();
    $("#qrout").innerHTML = qr.createSvgTag({cellSize:6,margin:2,scalable:true});
  }catch(e){ $("#qrout").textContent = "Alamat terlalu panjang untuk QR."; }
}
renderChips(); render();
</script>
